<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Simple UI (1.0.0.10)</title>
  <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.10.25/css/jquery.dataTables.min.css">
  <link rel="stylesheet" type="text/css"
    href="https://cdn.datatables.net/responsive/2.2.9/css/responsive.dataTables.min.css">
  <link href="https://cdn.jsdelivr.net/npm/jsoneditor@9.10.3/dist/jsoneditor.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" type="text/css" href="css/jquery.toast.min.css" />
  <link rel="stylesheet" type="text/css" href="css/jquery-ui.structure.min.css" />
  <link rel="stylesheet" type="text/css" href="css/jquery-ui.min.css" />
  <link rel="stylesheet" type="text/css" href="http://code.jquery.com/ui/1.9.2/themes/base/jquery-ui.css" />
  <!--<link href="https://use.fontawesome.com/releases/v5.0.8/css/all.css" rel="stylesheet">-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap"
    rel="stylesheet">
  <script type="text/javascript" src="/eel.js"></script>
  <script type="text/javascript" src="js/lib/jquery-3.5.0.min.js"></script>
  <script type="text/javascript" src="//code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
  <script type="text/javascript" src="js/lib/jquery.toast.min.js"></script>
  <script type="text/javascript" src="js/init.js"></script>
  <script type="text/javascript" src="js/conf.js"></script>
  <script type="text/javascript" src="js/main.js"></script>
  <script type="text/javascript" src="js/export.js"></script>
  <script type="text/javascript" src="js/dialogs.js"></script>
  <script type="text/javascript" src="js/utils.js"></script>
  <script type="text/javascript" src="js/renderElements.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/2.4.1/js/dataTables.responsive.min.js"></script>
  <script src="https://kit.fontawesome.com/d2e154fcf9.js" crossorigin="anonymous"></script>
  <script>
    var main = Object.create(Main);
    setConfigUIElements();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/jsoneditor@9.10.3/dist/jsoneditor.min.js"></script>
</head>

<body>
  <a href="#menu" class="toggle-mnu"><span></span></a>
  <div class="btn-group main">
    <button id="new-project" onclick="pickNewFileProject(main)">New Project<span>(Ctrl+N)</span></button>
    <button id="open-project" onclick="showPickFile()">Open Project<span>(Ctrl+O)</span></button>
    <button id="save-project" onclick="fileLocationSave()">Save Project<span>(Ctrl+S)</span></button>
    <button id="save-project-as" onclick="fileLocationSaveAs()">Save Project as...<span>(Ctrl+Shift+S)</span></button>
    <button id="export-data" onclick="exportConfigData()">Export Data<span>(Ctrl+Shift+E)</span></button>
    <button id="qr-settings" onclick="showQRSettings()">QR Settings<span>(Ctrl+Alt+Q)</span></button>
    <button id="preview-button" onclick="togglePrev()">Preview<span>(Ctrl+Alt+P)</span></button>
    <button id="open-modal-sql-queries" onclick="showSqlQueries()">SQL Query<span>(Ctrl+Alt+K)</span></button>
    <!-- <button id="open-modal-send-req" onclick="showSendRequest()">Send Request</button> -->
    <button id="open-modal-send-req" onclick="showSearchElements()">Search Elements<span>(Ctrl+Shift+F)</span></button>
    <!-- <button id="open-modal-auth" onclick="showAuth()">Login</button> -->
  </div>
  <div class="content-wrapper">
    <div class="content">
      <div class="header">
        <div class="logo"><img src="logo.png" alt="Simple Logo"></div>
      </div>
      <span class="file-path"></span>
      <span class="dir-path"></span>
      <div class="main-conf-wrap">
        <div class="tabs">
          <div onclick="selectTab(this)" class="tab active" data-tab-id="main-conf-common">Common</div>
          <div onclick="selectTab(this)" class="tab" data-tab-id="main-conf-process">Processes</div>
          <div onclick="selectTab(this)" class="tab" data-tab-id="main-conf-main-menu">Main menu</div>
          <div onclick="selectTab(this)" class="tab" data-tab-id="main-conf-properties">Properties</div>
          <div onclick="selectTab(this)" class="tab" data-tab-id="main-conf-schedulers">Shedulers</div>
          <!-- <div onclick="selectTab(this)" class="tab" data-tab-id="main-conf-python-files">Python files</div> -->
          <!-- <div onclick="selectTab(this)" class="tab" data-tab-id="main-conf-media-files">Media files</div> -->
          <div onclick="selectTab(this)" class="tab" data-tab-id="main-conf-common-handlers">Common handlers</div>
        </div>
        <section id="main-conf-common" class="active">
          <div class="section-header">Common<i class="fa fa-angle-up" aria-hidden="true"></i></div>
          <div class="list-wrap show">
            <ul class="list form configuration">
              <li class="param">
                <div>
                  <label for="ConfigurationName">Configuration-name</label>
                  <input type="text" name="ConfigurationName" id="ConfigurationName"
                    data-param-name="ConfigurationName">
                </div>
                <div>
                  <label for="ConfigurationVersion">Version</label>
                  <input type="text" name="ConfigurationVersion" id="ConfigurationVersion"
                    data-param-name="ConfigurationVersion">
                </div>
              </li>
              <li class="param">
                <div class="textarea-param-wrapper">
                  <label for="ConfigurationDescription">Description</label>
                  <textarea class="textarea-param" id="ConfigurationDescription" name="ConfigurationDescription"
                    data-param-name="ConfigurationDescription" rows="10">
									</textarea>
                </div>
              </li>
            </ul>
          </div>
        </section>
        <section id="main-conf-process">
          <div class="section-header">Processes<i class="fa fa-angle-up" aria-hidden="true"></i></div>
          <div class="list-wrap show">
            <ul class="list" id="processes">No process</ul>
          </div>
        </section>
        <section id="main-conf-main-menu">
          <div class="section-header">Main menu<i class="fa fa-angle-up" aria-hidden="true"></i></div>
          <div class="list-wrap show">
            <ul class="list" id="main-menu">No Items</ul>
          </div>
        </section>
        <section id="main-conf-properties">
          <div class="section-header">Properties<i class="fa fa-angle-up" aria-hidden="true"></i></div>
          <div class="list-wrap show">
            <ul class="list form configuration">
              <li class="param">
                <div>
                  <label for="vendor">Vendor</label>
                  <input type="text" name="vendor" id="vendor" data-param-name="vendor">
                </div>
                <div>
                  <label for="vendor_url">Vendor URL</label>
                  <input type="text" name="vendor_url" id="vendor_url" data-param-name="vendor_url">
                </div>
              </li>
              <li class="param">
                <div>
                  <label for="vendor-login">Vendor login (Basic)</label>
                  <input type="text" name="vendor-login" id="vendor-login">
                </div>
                <div>
                  <label for="vendor-password">Vendor password (Basic)</label>
                  <input type="password" name="vendor-password" id="vendor-password">
                </div>
              </li>
              <li class="param">
                <label for="vendor_auth">Vendor raw authorization string</label>
                <input type="text" name="vendor-auth" id="vendor_auth" data-param-name="vendor_auth" readonly>
              </li>
            </ul>
          </div>
        </section>
        <section id="main-conf-schedulers">
          <div class="section-header">Shedulers<i class="fa fa-angle-up" aria-hidden="true"></i></div>
          <div class="list-wrap show">
            <ul class="list" id="shedulers">No Items</ul>
          </div>
        </section>
        <section id="main-conf-python-files">
          <div class="section-header">Python files<i class="fa fa-angle-up" aria-hidden="true"></i></div>
          <div class="list-wrap show">
            <ul class="list">
              <li>
                <button id="open-py-handlers-file" onclick="pickHandlersFile()">Open file</button>
                <label>Handlers file (Python)</label>
              <li>
              </li class="param">
              <span id="py-handlers-file-path" data-param-name="pyHandlersPath">&lt;Not selected&gt;</span>
              </li>
            </ul>
            <ul class="list" id="py-files">No Items</ul>
          </div>
        </section>
        <section id="main-conf-media-files">
          <div class="section-header">Media files<i class="fa fa-angle-up" aria-hidden="true"></i>
          </div>
          <div class="list-wrap show">
            <ul class="list" id="media-files">No Items</ul>
          </div>
        </section>
        <section id="main-conf-common-handlers">
          <div class="section-header">Common handlers<i class="fa fa-angle-up" aria-hidden="true"></i></div>
          <div class="list-wrap show">
            <ul class="list" id="common-handlers">No Items</ul>
          </div>
        </section>
      </div>
    </div>
    <div class="prev-wrap">
      <div id="prev">
        <div class="prev-content">
          <div class="preload">Project preview</div>
        </div>
      </div>
    </div>
  </div>
  <div id="modals-wrap"></div>
  <div class="hidden-conf-json"></div>
  <footer></footer>
</body>

</html>
